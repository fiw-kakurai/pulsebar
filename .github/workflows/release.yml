name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Get version from tag
        id: version
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Build installer
        shell: pwsh
        # Inno Setup is preinstalled on windows-latest runners.
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.version }} installer\pulsebar.iss'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/pulsebar.exe
            installer/Output/pulsebar-setup-*.exe
          generate_release_notes: true
